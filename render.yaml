services:
  - type: web
    name: football-predictor
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: FOOTBALL_DATA_API_KEY
        sync: false
      - key: REFRESH_HOURS
        value: "6"
